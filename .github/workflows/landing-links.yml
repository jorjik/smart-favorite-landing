name: Landing links

on:
  push:
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "scripts/check_landing_links.py"
      - ".github/workflows/landing-links.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "scripts/check_landing_links.py"
      - ".github/workflows/landing-links.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local links, anchors and import deep links
        run: python scripts/check_landing_links.py
